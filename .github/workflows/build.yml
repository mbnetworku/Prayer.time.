name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Unit tests (prayer-time calculation vs the mosque display, all regions)
        run: gradle testDebugUnitTest -PbuildNumber=${{ github.run_number }}
      - name: Code check (lint) - report only
        continue-on-error: true
        run: gradle lintDebug -PbuildNumber=${{ github.run_number }}
      - name: Show lint findings
        continue-on-error: true
        run: cat app/stdout
      - run: gradle assembleDebug -PbuildNumber=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PrayerTimeTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrayerTimeTV-debug-apk
          path: PrayerTimeTV.apk
      # Every successful build on master is published as a Release with the APK attached.
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Debug APK built from commit ${{ github.sha }}. See CHANGELOG.md."
          files: PrayerTimeTV.apk
