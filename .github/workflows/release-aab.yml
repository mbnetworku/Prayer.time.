name: Release AAB (Google Play)

# Manual run: Actions > "Release AAB (Google Play)" > Run workflow.
# Needs 4 repository secrets - see docs/RELEASE_SIGNING.md.
on:
  workflow_dispatch:
    inputs:
      include_adhan_audio:
        description: "Include the bundled adhan recordings (only if you own / are licensed to use them)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KK: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS KP KA KK; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v - see docs/RELEASE_SIGNING.md"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Leave out the adhan recordings (default)
        if: ${{ !inputs.include_adhan_audio }}
        run: rm -f app/src/main/res/raw/adhan*.mp3

      - name: Decode upload keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed bundle and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      # Artifacts are private to people with access to the repository (not public like Releases).
      - uses: actions/upload-artifact@v4
        with:
          name: PrayerTimes-play-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PrayerTimes-release-apk-for-testing
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
